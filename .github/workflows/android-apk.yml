name: Android CI & APK Distribution

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_release_if_signed:
        description: "Build a signed release APK if signing secrets are configured"
        required: false
        default: true
        type: boolean
  release:
    types:
      - published

permissions:
  contents: write

# Queue runs for the same branch instead of cancelling a build in progress.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit & Robolectric Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build & Package APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Output Directory
        run: mkdir -p dist

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found at $DEBUG_APK"
            exit 1
          fi

          cp "$DEBUG_APK" dist/CancelBefore-debug.apk
          sha256sum dist/CancelBefore-debug.apk
          ls -lh dist/CancelBefore-debug.apk

      - name: Build Signed Release APK If Configured
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release_if_signed }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] ||
             [ -z "${STORE_PASSWORD:-}" ] ||
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Signing secrets are not configured; skipping release APK."
            exit 0
          fi

          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          export KEYSTORE_PATH="$KEYSTORE_FILE"

          ./gradlew :app:assembleRelease --no-daemon --stacktrace

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found at $RELEASE_APK"
            exit 1
          fi

          cp "$RELEASE_APK" dist/CancelBefore-release.apk
          sha256sum dist/CancelBefore-release.apk
          ls -lh dist/CancelBefore-release.apk

      - name: Validate APK Files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/CancelBefore-debug.apk ] &&
             [ ! -f dist/CancelBefore-release.apk ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CancelBefore-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach APKs to Published GitHub Release
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
