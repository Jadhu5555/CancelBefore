name: Android CI & APK Distribution

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release_if_signed:
        description: 'Attempt signed release build if secrets are configured'
        required: false
        default: 'true'
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit & Robolectric Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          # Gradle configuration currently expects this file in the project root.
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Report Artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build & Package APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          # The Gradle debugConfig points to the repository-root debug.keystore.
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Output Directory
        run: mkdir -p dist

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building debug APK..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Expected APK not found: $DEBUG_APK"
            exit 1
          fi

          cp "$DEBUG_APK" dist/CancelBefore-debug.apk
          ls -lh dist/CancelBefore-debug.apk

      - name: Build Signed Release APK (if secrets configured)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release_if_signed }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ] &&
             [ -n "${STORE_PASSWORD:-}" ] &&
             [ -n "${KEY_PASSWORD:-}" ]; then

            KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT

            echo "Decoding release upload keystore..."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"

            echo "Building signed release APK..."
            ./gradlew :app:assembleRelease --no-daemon --stacktrace

            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

            if [ ! -f "$RELEASE_APK" ]; then
              echo "::error::Release build completed without the expected APK: $RELEASE_APK"
              exit 1
            fi

            cp "$RELEASE_APK" dist/CancelBefore-release.apk
            ls -lh dist/CancelBefore-release.apk
          else
            echo "Release signing secrets are not configured."
            echo "The debug APK will be provided for testing."
          fi

      - name: Validate Generated Artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/

          if [ ! -f dist/CancelBefore-debug.apk ] &&
             [ ! -f dist/CancelBefore-release.apk ]; then
            echo "::error::No APKs were generated."
            exit 1
          fi

      - name: Upload APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CancelBefore-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APKs to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
